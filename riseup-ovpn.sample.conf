client

dev tun
proto tcp
nobind

# Riseup available servers
remote <IP> <PORT>
remote-random

# Quick reconnect
persist-key
persist-tun
pull-filter ignore "ping"
pull-filter ignore "ping-restart"
pull-filter ignore "keepalive"
keepalive 10 20
server-poll-timeout 10
connect-retry 1 2
connect-retry-max 1

# Cipher
cipher AES-256-GCM
data-ciphers AES-256-GCM
remote-cert-tls server

verb 1
